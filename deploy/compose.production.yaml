# Overlay for a 2-core / 2-GB server. Keep the application behind a host reverse proxy.
services:
  mysql:
    ports: !reset []
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 256
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=128M
      - --innodb-redo-log-capacity=64M
      - --max-connections=40
      - --table-open-cache=256
      - --performance-schema=OFF
      - --mysqlx=0
      - --skip-name-resolve
  app:
    build:
      args:
        PIP_INDEX_URL: ${PARTSBOX_PIP_INDEX_URL:-https://pypi.org/simple}
    mem_limit: 384m
    cpus: 1.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
